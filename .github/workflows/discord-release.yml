name: Announce releases on Discord

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send release announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          RELEASE_NAME="${RELEASE_NAME:-Bilingual preview / Anteprima bilingue}"
          RELEASE_TAG="${RELEASE_TAG:-TEST}"
          RELEASE_URL="${RELEASE_URL:-https://github.com/gigigames85/fs25-mod-center/releases}"
          RELEASE_BODY="${RELEASE_BODY:-## English

### Preview
Discord release announcements are now available in English and Italian.

---

## Italiano

### Anteprima
Gli annunci delle release su Discord sono ora disponibili in inglese e italiano.}"
          RELEASE_IS_PRERELEASE="${RELEASE_IS_PRERELEASE:-true}"

          PAYLOAD=$(jq -n \
            --arg username "FS25 Mod Center" \
            --arg content "📢 **New release available / Nuova versione disponibile**" \
            --arg title "🚜 FS25 Mod Center · ${RELEASE_NAME:-$RELEASE_TAG}" \
            --arg url "$RELEASE_URL" \
            --arg tag "$RELEASE_TAG" \
            --arg body "$RELEASE_BODY" \
            --arg prerelease "$RELEASE_IS_PRERELEASE" '
              def shorten($n):
                if (. // "" | length) > $n then .[0:$n] + "…" else (. // "") end;

              def releaseType:
                if $prerelease == "true" then "Pre-release / Anteprima"
                else "Stable / Stabile"
                end;

              def fallbackDescription:
                "**English**\nA new version of FS25 Mod Center is now available.\n\n**Italiano**\nÈ disponibile una nuova versione di FS25 Mod Center.";

              {
                username: $username,
                content: $content,
                embeds: [
                  {
                    color: 5763719,
                    title: $title,
                    url: $url,
                    description:
                      (if ($body // "" | length) > 0
                       then ($body | shorten(3400))
                       else fallbackDescription
                       end),
                    fields: [
                      { name: "🏷️ Version / Versione", value: ($tag // "-"), inline: true },
                      { name: "📦 Type / Tipo", value: releaseType, inline: true },
                      { name: "⬇️ Download", value: ("[Open release on GitHub / Apri la release su GitHub](" + $url + ")"), inline: false }
                    ],
                    footer: { text: "FS25 Mod Center • GitHub Releases" },
                    timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
                  }
                ]
              }')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
