name: Announce releases on Discord

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - '.github/workflows/discord-release.yml'

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send release announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_RELEASE_NAME: ${{ github.event_name == 'release' && github.event.release.name || 'Test collegamento Discord' }}
          GITHUB_EVENT_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'TEST' }}
          GITHUB_EVENT_RELEASE_URL: ${{ github.event_name == 'release' && github.event.release.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          GITHUB_EVENT_RELEASE_BODY: ${{ github.event_name == 'release' && github.event.release.body || '✅ Collegamento GitHub → Discord configurato correttamente per FS25 Mod Center.' }}
          GITHUB_EVENT_RELEASE_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg username "FS25 Mod Center" \
            --arg title "🚜 FS25 Mod Center — ${GITHUB_EVENT_RELEASE_NAME:-${GITHUB_EVENT_RELEASE_TAG}}" \
            --arg url "$GITHUB_EVENT_RELEASE_URL" \
            --arg tag "$GITHUB_EVENT_RELEASE_TAG" \
            --arg body "$GITHUB_EVENT_RELEASE_BODY" \
            --arg prerelease "$GITHUB_EVENT_RELEASE_PRERELEASE" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                url: $url,
                description: (($body | if length > 3500 then .[0:3500] + "…" else . end) // "A new version is available."),
                fields: [
                  {name: "Version", value: $tag, inline: true},
                  {name: "Release", value: (if $prerelease == "true" then "Pre-release" else "Stable" end), inline: true}
                ],
                footer: {text: "GitHub Release • FS25 Mod Center"}
              }]
            }')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
