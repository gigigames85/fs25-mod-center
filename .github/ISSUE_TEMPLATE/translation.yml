name: Translation contribution / Contributo traduzione
description: Help translate FS25 Mod Center or improve an existing translation / Aiuta a tradurre FS25 Mod Center o migliora una traduzione esistente
title: "[Translation]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make FS25 Mod Center accessible to more users.
        Grazie per contribuire a rendere FS25 Mod Center accessibile a più utenti.

        **Before contributing, please use the official English reference catalog:**
        **Prima di contribuire, usa il catalogo inglese ufficiale di riferimento:**
        [Translation guide / Guida alle traduzioni](https://github.com/gigigames85/fs25-mod-center/tree/main/translations) · [en-US.json](https://github.com/gigigames85/fs25-mod-center/blob/main/translations/en-US.json)

        For a complete new language, copy `en-US.json`, keep every key unchanged, translate only the values, and attach the completed JSON file below.
        Per una nuova lingua completa, copia `en-US.json`, mantieni tutte le chiavi invariate, traduci soltanto i valori e allega qui sotto il file JSON completato.

  - type: dropdown
    id: contribution-type
    attributes:
      label: Contribution type / Tipo di contributo
      options:
        - New language / Nuova lingua
        - Translation correction / Correzione traduzione
        - Terminology improvement / Miglioramento terminologico
        - Missing text / Testo mancante
        - Other / Altro
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language / Lingua
      description: Enter the language you want to contribute to.
      placeholder: e.g. German / Tedesco, French / Francese, Spanish / Spagnolo
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: Translation contribution / Contributo alla traduzione
      description: For a complete language, attach the translated JSON file here. For a correction, provide the original key/text and your proposed translation. / Per una lingua completa, allega qui il file JSON tradotto. Per una correzione, indica la chiave/testo originale e la traduzione proposta.
      placeholder: Attach the translated JSON file, or enter the original key/text and your proposed translation.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context or location in the app / Contesto o posizione nell'app
      description: Tell us where the text appears, for example Settings, Library, Profiles or Updates. Screenshots are welcome.
      placeholder: Where does this text appear? Add any useful context or screenshots.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes / Note aggiuntive
      description: Add any terminology notes, alternatives or explanations that may help review the translation.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks / Controlli preliminari
      options:
        - label: I used the latest official English reference catalog and kept the JSON keys unchanged. / Ho usato l'ultimo catalogo inglese ufficiale e ho mantenuto invariate le chiavi JSON.
          required: true
        - label: I have checked that a similar translation contribution has not already been submitted. / Ho verificato che un contributo simile non sia già stato inviato.
          required: true
